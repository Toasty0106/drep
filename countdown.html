<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Countdown</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="kitty.webp">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Countdown to your special day!</h1>
        <div class="countdown-container">

    <div class="time-box">
        <span id="days">0</span>
        <p>Days</p>
    </div>

    <div class="time-box">
        <span id="hours">0</span>
        <p>Hours</p>
    </div>

    <div class="time-box">
        <span id="minutes">0</span>
        <p>Minutes</p>
    </div>

    <div class="time-box">
        <span id="seconds">0</span>
        <p>Seconds</p>
    </div>

    <div style="width: 100%; text-align: center; display: block;">
        <img src="/countdown-page-photos/WhatsApp Image 2026-10-12 at 15.52.18.jpeg" alt="My GOAT" class="countdown-photo1" style="width: 437px; margin-left: 10px; margin-top: 10px;">
        <img src="/countdown-page-photos/WhatsApp Image 2026-10-29 at 03.53.09 (1).jpeg" alt="My GOAT" class="countdown-photo3" style="width: 437px; margin-left: 10px; margin-top: 1px;">
        <img src="/countdown-page-photos/WhatsApp Image 2026-10-29 at 03.53.09 (2).jpeg" alt="qt patootie" class="countdown-photo5" style="width: 880px; margin-left: 10px; margin-top: 1px;">
    </div>
    <div>
        <img src="/countdown-page-photos/WhatsApp Image 2026-10-29 at 03.53.08.jpeg" alt="My GOAT" class="countdown-photo2" style="width: 437px; margin-left: 228px; margin-top: 10px;">
        <img src="/countdown-page-photos/WhatsApp Image 2026-10-29 at 03.53.09.jpeg" alt="My GOAT" class="countdown-photo4" style="width: 437px; margin-left: 228px; margin-top: 1px;">
    </div>


    </div>
        <br>
        <a href="index.html"><button>Back to Home</button></a>
        <script src="script.js"></script>
    </div>
    
    <audio id="bg-music" src="./sounds/bday.mp3" preload="auto"></audio>

    <div class="audio-player">
        <button id="play-pause-btn" class="player-btn">▶</button>
        <div class="progress-container" id="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div id="player-time" class="player-time">0:00 / 0:00</div>

    <script src="audio.js"></script>
    <script src="countdown.js"></script>
</body>
</html>
